<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A demonstration of lazy loading images using HTML, CSS and JavaScript.">
    <meta name="author" content="Emmanuel Innocent">
    <title>Lazy Loading Images</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
  <header>
    <h1>Lazy Loading Images</h1>
  </header>
  <main>
    <img src="images/jogging.jpg"alt="A person jogging outdoors"loading="lazy"width="400"height="600">
    <img src="images/stretching.jpg"alt="A person stretching before exercise"loading="lazy"width="400"height="600">
    <img src="images/yoga.jpg"alt="A person practising yoga"loading="lazy"width="400"height="600">
    <img src="images/healthy-meal.jpg"alt="A healthy meal prepared with fresh ingredients"loading="lazy"width="400"height="600">
    <img src="images/fruits.jpg"alt="Fresh fruits and vegetables"loading="lazy"width="400"height="600">
    <img src="images/cycling.jpg"alt="A person cycling outdoors"loading="lazy"width="400"height="600">
  </main>
  <footer>
    <p>&copy; 2026 FitLife | All Rights Reserved</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
