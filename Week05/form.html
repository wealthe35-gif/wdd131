<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form</title>
  <meta name="description" content="Product review form for WDD 131 assignment">
  <meta name="author" content="Emmanuel U. Innocent">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>
  <main>
    <form method="get" action="review.html">
      <div class="form-group">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
          <option value="adjustable-dumbbells">Adjustable Dumbbell Set</option>
          <option value="olympic-barbell">Olympic Barbell</option>
          <option value="treadmill">Treadmill</option>
          <option value="exercise-bike">Stationary Exercise Bike</option>
          <option value="squat-rack">Squat Power Rack</option>
          <option value="rowing-machine">Rowing Machine</option>
          <option value="kettlebell-set">Kettlebell Set</option>
        </select>
      </div>
      <div class="form-group">
        <p class="group-label">Overall Rating</p>
        <div class="rating-container">
          <div class="rating-option">
            <label for="star1">&star;</label>
            <input type="radio" id="star1" name="rating" value="1" required>
          </div>
          <div class="rating-option">
            <label for="star2">&star;&star;</label>
            <input type="radio" id="star2" name="rating" value="2" required>
          </div>
          <div class="rating-option">
            <label for="star3">&star;&star;&star;</label>
            <input type="radio" id="star3" name="rating" value="3" required>
          </div>
          <div class="rating-option">
            <label for="star4">&star;&star;&star;&star;</label>
            <input type="radio" id="star4" name="rating" value="4" required>
          </div>
          <div class="rating-option">
            <label for="star5">&star;&star;&star;&star;&star;</label>
            <input type="radio" id="star5" name="rating" value="5" required>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>
      <div class="form-group">
        <p class="group-label">Which features did you find useful in the product?</p>
        <p class="italic-note">(Check all that apply)</p>
        <div class="checkbox-list">
          <div class="checkbox-item">
            <input type="checkbox" id="durability" name="features" value="Durability">
            <label for="durability">Durability</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="ease" name="features" value="Ease of Use">
            <label for="ease">Ease of Use</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="performance" name="features" value="Performance">
            <label for="performance">Performance</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="design" name="features" value="Design">
            <label for="design">Design</label>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="writtenReview" name="writtenReview" rows="6"></textarea>
      </div>
      <div class="form-group">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" name="userName">
      </div>
      <input type="submit" value="Post Review" class="submit-btn">
    </form>
  </main>
  <footer>
    <p>&copy;<span id="currentyear"></span> Emmanuel U. Innocent</p>
    <p>Nigeria</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
